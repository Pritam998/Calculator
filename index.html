<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./calculator.css">
    <title>Calculator</title>
</head>
<body>

    <div class="main">
        <div class="screen">
            <div class="screen_que">
                
            </div>

            <div class="screen_operation">

            </div>

            <div class="screen_que_opt">

            </div>

            <div class="screen_ans">
                
            </div>

        </div>
        
        <div class="btn">
            <button class="all_clear">AC</button>
            <button class="division">/</button>
            <button class="delete">Del</button>
            <button class="add">+</button>
            <button class="seven">7</button>
            <button class="eight">8</button>
            <button class="nine">9</button>
            <button class="sub">-</button>
            <button class="four">4</button>
            <button class="five">5</button>
            <button class="six">6</button>
            <button class="mul">x</button>
            <button class="one">1</button>
            <button class="two">2</button>
            <button class="three">3</button>
            <button class="equalto">=</button>
            <button class="zero">0</button>
            <button class="dot">.</button>
          <p class="tech"><b> Tech_Club </b></p>
        </div>

    </div>

    <script src="./calculator.js"></script>

    
</body>
</html>
